name: Generate Action Code
description: Generates the action code

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        check-latest: true
        cache: npm
    - name: Generate action code
      shell: bash
      run: |
        npm clean-install
        npm run build
        npm run pack
